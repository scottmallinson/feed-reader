name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feeds
          POSTGRES_PASSWORD: feeds
          POSTGRES_DB: feeds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feeds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://feeds:feeds@localhost:5432/feeds_test
      - run: npm run build
      - name: Vercel entry point loads
        run: node --input-type=module -e "const m = await import('./api/index.mjs'); if (typeof m.default !== 'function') throw new Error('api/index.mjs has no default handler');"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosted image
        run: docker build -t feed-reader:ci .
